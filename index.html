<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <title>Batcaver Quest</title>
</head>

<body>
    <div class="portal">
        <div class="portal-title">
            <img src="https://files.catbox.moe/8rsivt.gif" alt="Enter the cave...?">
        </div>
        <div class="options">
            <a href="home.html" class="yes">
                <figure>
                    <img src="https://files.catbox.moe/oyv72b.gif" alt="">
                    <figcaption>Enter the Batcave</figcaption>
                </figure>
            </a>
            <a href="#" class="no" onclick="back()">
                <figure>
                    <img src="https://files.catbox.moe/rrtkt5.gif" alt="">
                    <figcaption>Run Away</figcaption>
                </figure>
            </a>
        </div>
    </div>

    <script>
        function back() {
            window.history.back();
        };
    </script>
</body>
